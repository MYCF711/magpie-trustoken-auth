name: release

# 推一个 v* tag，就把 CHANGELOG.md 里该版本那几条抽出来，建成 GitHub Release。
#
# 为什么要有这个：Release 的正文就是「更新内容，一条条列出来」——
# 手工复制迟早会漏，而正文与 CHANGELOG 分家就会互相打架。
# 机制见 UPDATING.md；这里只做一件事：CHANGELOG 是唯一来源，Release 是它的投影。
#
# ⚠ 这个 workflow 不参与 magpie 的更新检测（那是 push 默认分支 + npm publish 的事）。
#   Release 是给人看的。

on:
  push:
    tags:
      - "v*"
  # 想刷新已发版本的 Release 正文，就在 Actions 页面手动跑一次 ——
  # 别用「删 tag 再重推」：GitHub 删 tag 时会把它的 Release 转成草稿（网页上就看不见了）。
  workflow_dispatch:
    inputs:
      tag:
        description: 要刷新的 tag，例如 v0.1.3
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 只允许发布已合并且验证通过的提交
        env:
          REF_NAME: ${{ inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          test "$REF_NAME" = "$expected"
          git fetch origin "$DEFAULT_BRANCH" --quiet
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
          node scripts/check.mjs
          npm test
          npm pack --dry-run

  release:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: 从 CHANGELOG.md 抽出这个版本的条目
        env:
          REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ver="${REF_NAME#v}"

          if [ ! -f CHANGELOG.md ]; then
            echo "没有 CHANGELOG.md —— Release 正文留空" >&2
            printf '见仓库根目录的 CHANGELOG.md。\n' > notes.md
            exit 0
          fi

          # 取 "## <ver>" 那一节，到下一个 "## " 之前；去掉空行
          awk -v ver="$ver" '
            /^## / {
              if (f) exit
              if (substr($0, 4, length(ver)) == ver) { f = 1; next }
            }
            f { print }
          ' CHANGELOG.md | sed '/^[[:space:]]*$/d' > notes.md

          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md 里没有 $ver 这一节" >&2
            printf '见仓库根目录的 CHANGELOG.md。\n' > notes.md
          fi

          echo "--- Release 正文 ---"
          cat notes.md

      - name: 建 Release（已存在则刷新正文）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 重推同一个 tag 时刷新，而不是报错 —— CHANGELOG 改了，Release 就跟着改
          # ⚠ --draft=false 是必需的：tag 被删过的话，GitHub 会把 Release 转成草稿，
          #   而 `gh release view` 看得见草稿 —— 于是走 edit 分支，草稿就一直是草稿。
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file notes.md \
              --draft=false
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file notes.md
          fi

  # ── npm：作者自己的选择，不配 token 就跳过 ──────────────────────
  #
  # ⚠ npm 不允许包名含大写。想让卡片标题好看又要能发 npm，就在仓库里放
  #   scripts/publish-npm.mjs（UPDATING.md「git 源想要大写标题、npm 又要能发」），
  #   它在发布那一下换 name、跑完改回来；没有这个脚本就直接发。
  npm:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "没配 NPM_TOKEN —— 跳过 npm 发布（想发就在 Settings → Secrets 里加）"
            exit 0
          fi
          if [ -f scripts/publish-npm.mjs ]; then
            node scripts/publish-npm.mjs
          else
            npm publish --access public
          fi
